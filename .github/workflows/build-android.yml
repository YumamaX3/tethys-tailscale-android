name: build-android

# Milestone M2 — the build & release current.
#
# The daemon the module runs does not exist in either repository as a committed
# file: it is produced HERE, by checking out the pinned Tailscale tag, applying
# this fork's patch series, and building the android target. That is the whole
# point of owning a patch fork (plan decision D1) — every defect the plan cares
# about lives inside the Go binary, and a binary someone else built cannot be
# repaired from outside it.
#
# The build is driven by ./scripts/android.sh, which patch 0001 CREATES. Its
# behaviour is read from that patch, not guessed:
#
#   build [--pre] [--upx] [--nocgo] <arm|arm64|amd64>
#     - ARM64 : GOARCH=arm64, CC=aarch64-linux-android21-clang
#     - NDK   : r27c; setup_ndk() provisions it when ANDROID_NDK_PATH is unset,
#               so this workflow does NOT need a separate NDK action
#     - CGO_ENABLED=1 by default (the NDK is required); --nocgo drops it
#     - output: dist/tailscaled.<arch>
#   check  : go vet + a build of both binaries, android/<arch>
#
# UPX is deliberately NOT used. Plan R34 names it, and the plan's own risk
# register returns the answer: "UPX-packed binary trips AV / Play Protect — ...
# the CI also emits an uncompressed build." The artifact travels inside a module
# zip, so the download is already compressed; the packing would buy little and
# risk the binary being quarantined on the very device it targets. The
# uncompressed build IS the released artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Build as a pre-release (appends -pre to the version stamp)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAILSCALE_TAG: v1.98.8

jobs:
  build:
    name: android/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Pixel 6 Pro is arm64-v8a, so arm64 is what the module consumes.
        # arm is built because the plan's M2 proof names both, and because it
        # keeps this series honest for other devices without re-running CI later.
        arch: [arm64, arm]
    steps:
      - name: The tag must carry its story (tag runs only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # A release body is the STORY of the artifact, and this fork writes that
          # story in the annotated tag. The publish step reads it from the tag
          # object through the API; this guard exists so that a tag which cannot
          # supply one is refused BEFORE two 25 MB binaries are built.
          #
          # It is here because the first published release took its body from
          # fork/docs/PROVENANCE.md instead - a better document than most release
          # notes, and still not the release note: the tag's own story never
          # appeared on the release at all (v1.98.8-tethys.0, measured 2026-09-23).
          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag")"
          obj_type="$(printf '%s' "$ref_json" | jq -r .object.type)"
          obj_sha="$(printf '%s' "$ref_json" | jq -r .object.sha)"
          test "$obj_type" = "tag" || {
            echo "FAIL: $tag is not an annotated tag - there is no story to publish" >&2
            exit 1
          }
          story_bytes="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj_sha" --jq '.message | length')"
          test "$story_bytes" -gt 0 || {
            echo "FAIL: the annotated tag $tag carries no message" >&2
            exit 1
          }
          echo "the tag carries $story_bytes bytes of story"

      - name: Checkout the fork (patch series + splitter)
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Checkout Tailscale at the pinned tag
        uses: actions/checkout@v4
        with:
          repository: tailscale/tailscale
          ref: ${{ env.TAILSCALE_TAG }}
          path: tailscale
          fetch-depth: 1

      - name: Verify the series applies cleanly, nothing applied
        working-directory: tailscale
        run: |
          set -euo pipefail
          n=0
          for p in ../fork/patches/0*.patch; do
            git apply --check "$p" || { echo "FAIL: $(basename "$p") does not apply" >&2; exit 1; }
            n=$((n + 1))
          done
          echo "all $n patches apply cleanly onto $TAILSCALE_TAG"

      - name: Apply the patch series
        working-directory: tailscale
        run: |
          set -euo pipefail
          for p in ../fork/patches/0*.patch; do
            echo "applying $(basename "$p")"
            git apply "$p"
          done
          # scripts/android.sh is created by patch 0001 - if it is missing, the
          # series did not apply and every step below would be meaningless.
          test -x ./scripts/android.sh || { echo "FAIL: scripts/android.sh absent after patching" >&2; exit 1; }

      - name: Wire every device profile that builds this arch
        working-directory: fork
        run: |
          set -euo pipefail
          # The profiles are the build's own configuration, so they are verified
          # BEFORE they are trusted. A profile naming the wrong NDK, or an ABI its
          # own GOARCH cannot produce, is worse than no profile at all: it would
          # be a document of intent wearing a configuration's authority. The
          # verifier re-derives each claim from the build itself - the NDK from
          # patch 0001, CGO and the arch matrix from this workflow - and fails
          # loudly the day any of them drifts.
          sh tools/check-device-profile.sh

          for p in devices/*.env; do
            # Read each profile in a subshell: nothing it sets may reach this
            # shell until we have decided that it describes THIS leg.
            arch=$( ( set -eu; set -a; . "$p"; printf '%s' "${TETHYS_GOARCH-}" ) )
            if [ "$arch" != "${{ matrix.arch }}" ]; then
              echo "$p: builds $arch, not ${{ matrix.arch }} - skipped"
              continue
            fi

            # GOARM64 reaches the toolchain by INHERITANCE - android.sh never
            # names it, it only inherits it - so the export must land in the
            # environment the build actually runs in. The value shipped is the
            # profile's conservative default: Go's arm64 baseline is v8.0, and
            # raising the level past what the silicon satisfies is an illegal
            # instruction at runtime, never a build error. Raise it in the
            # profile only after measuring on the device.
            goarm64=$( ( set -eu; set -a; . "$p"; printf '%s' "${TETHYS_GOARM64-}" ) )
            test -n "$goarm64" || { echo "FAIL: $p declares no TETHYS_GOARM64" >&2; exit 1; }

            # Two profiles claiming one arch with different levels would be
            # resolved by whichever the glob visited last - a silent coin toss.
            if [ -n "${seen_goarm64-}" ] && [ "$seen_goarm64" != "$goarm64" ]; then
              echo "FAIL: two profiles build ${{ matrix.arch }} with different GOARM64 ($seen_goarm64 vs $goarm64)" >&2
              exit 1
            fi
            seen_goarm64=$goarm64

            echo "GOARM64=$goarm64" >> "$GITHUB_ENV"
            echo "$p: wired for ${{ matrix.arch }} (GOARM64=$goarm64)"
          done

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tailscale/go.mod
          cache-dependency-path: tailscale/go.sum

      - name: Build android/${{ matrix.arch }}
        working-directory: tailscale
        run: |
          set -euo pipefail
          # android.sh provisions NDK r27c itself when ANDROID_NDK_PATH is unset.
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            ./scripts/android.sh build --pre "${{ matrix.arch }}"
          else
            ./scripts/android.sh build "${{ matrix.arch }}"
          fi

      - name: Vet android/${{ matrix.arch }} (check is arm64-only by contract)
        working-directory: tailscale
        run: |
          set -euo pipefail
          # android.sh's own usage block documents this verb as `check [arm64]`,
          # and the reason is a platform rule rather than a package: Go's
          # internal/platform.MustLinkExternal returns true for android/arm with
          # or without cgo, so with the verb's pinned CGO_ENABLED=0 the go command
          # refuses outright before it analyses anything -
          #   android/arm requires external (cgo) linking, but cgo is not enabled
          # That refusal is what failed the first tag run (v1.98.8-tethys.0) - and
          # it was the only failure: the arm artifact had already been built by
          # the step above.
          #
          # So this leg's proof is its build, which compiles the SHIPPED artifact
          # with the release recipe itself (CGO_ENABLED=1 + NDK r27c). What it does
          # not get is vet plus a compile-check of the CLI - and this release ships
          # no CLI. Named here rather than left to be discovered.
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ./scripts/android.sh check arm64
          else
            echo "arm: android/arm has no internal-link path, so check (CGO_ENABLED=0) cannot vet it - the cgo build above is this leg's proof"
          fi

      - name: Probe the binary (do not ship one that cannot report itself)
        working-directory: tailscale
        run: |
          set -euo pipefail
          BIN="dist/tailscaled.${{ matrix.arch }}"
          test -s "$BIN" || { echo "FAIL: $BIN missing or empty" >&2; exit 1; }
          file "$BIN"
          ls -l "$BIN"
          ./build_dist.sh shellvars > /tmp/shellvars.txt || true
          cat /tmp/shellvars.txt || true

      - name: Checksum the artifact
        working-directory: tailscale
        run: |
          set -euo pipefail
          cd dist
          sha256sum "tailscaled.${{ matrix.arch }}" > "tailscaled.${{ matrix.arch }}.sha256"
          cat "tailscaled.${{ matrix.arch }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscaled-${{ matrix.arch }}
          path: |
            tailscale/dist/tailscaled.${{ matrix.arch }}
            tailscale/dist/tailscaled.${{ matrix.arch }}.sha256
          if-no-files-found: error

  release:
    name: publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the fork
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Collect every artifact
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Build the SHA256 manifest
        run: |
          set -euo pipefail
          cd out
          ls -l
          # One manifest covering every artifact, so a downloader verifies with
          # a single command rather than per-file guesswork.
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "--- manifest ---"
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # The Description Decree: a release carries the story, not a bare
          # "Release vX". The story lives in the annotated tag, so it is read from
          # the tag object itself - the previous revision of this step handed a
          # document to --notes-file and published a provenance paper where the
          # release note belonged (v1.98.8-tethys.0, measured 2026-09-23).
          #
          # PROVENANCE.md still travels with the release, as an ASSET: it is the
          # document a downloader wants beside the binary, and keeping it
          # reachable costs nothing while the body says what the release IS.
          obj_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" --jq '.object.sha')"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj_sha" --jq '.message' > RELEASE-NOTES.md
          test -s RELEASE-NOTES.md || { echo "FAIL: no story on $tag" >&2; exit 1; }

          # The story lists what this release carries, and PROVENANCE.md is now one
          # of those things - so the body names it rather than leaving an
          # unexplained fourth file beside the binaries.
          printf '\nProvenance: every fact this fork rests on, with its source and a checksum of\nthe exact bytes read, travels beside the binaries as PROVENANCE.md.\n' >> RELEASE-NOTES.md

          # Idempotent on purpose: a re-cast tag must be able to REPAIR its
          # release, not collide with it.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "tethys-tailscale-android $tag" \
            --notes-file RELEASE-NOTES.md \
            out/tailscaled.arm64 out/tailscaled.arm out/SHA256SUMS fork/docs/PROVENANCE.md || {
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file RELEASE-NOTES.md
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
              out/tailscaled.arm64 out/tailscaled.arm out/SHA256SUMS fork/docs/PROVENANCE.md --clobber
          }
